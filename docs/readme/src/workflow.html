<head>
<meta charset="utf-8">
<title>One turn through CortexNET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  html, body { width: 1040px; height: 480px; background: transparent; overflow: hidden; }

<body>
<svg width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">One turn through CortexNET</title>
  <desc id="workflow-desc">A request warms the files the model is likely to want; each model turn reads files outline-first; a body the read
    left out is fetched as a range read and logged as a miss for the include model; the fade then shrinks stale reads if the context is
    above 85%, and the loop continues until the model answers.</desc>
  <defs>
    <radialGradient id="wf-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 0) scale(560 320)">
      <stop offset="0" stop-color="#2fae5c" stop-opacity="0.28"/><stop offset="1" stop-color="#2fae5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wf-edge" x1="0" y1="0" x2="1040" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fae5c" stop-opacity="0.8"/><stop offset="0.5" stop-color="#a8e22a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eef3e4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wf-focal" x1="544" y1="192" x2="728" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fae5c"/><stop offset="0.55" stop-color="#a8e22a"/><stop offset="1" stop-color="#eef35a"/>
    </linearGradient>
    <marker id="wf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b39c"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="479" rx="16" fill="#121612"/>
  <rect x="0.5" y="0.5" width="1039" height="479" rx="16" fill="url(#wf-glow)"/>
  <rect x="0.5" y="0.5" width="1039" height="479" rx="16" fill="none" stroke="url(#wf-edge)"/>

  <text class="title" x="32" y="48">One turn in Cortex CLI</text>
  <text class="caption" x="32" y="76">From a request to the answer. The highlighted step is where CortexNET decides what the model sees.</text>

  <!-- connectors -->
  <line x1="144" y1="224" x2="174" y2="224" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="344" y1="224" x2="374" y2="224" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="512" y1="224" x2="542" y2="224" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="728" y1="224" x2="746" y2="224" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="844" y1="224" x2="870" y2="224" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="848" y="200" width="20" height="12" fill="#121612"/><text class="lbl" x="850" y="210">no</text>
  <line x1="796" y1="264" x2="796" y2="318" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="804" y="284" width="28" height="12" fill="#121612"/><text class="lbl" x="806" y="294">yes</text>
  <path d="M868,352 H932 Q940,352 940,344 V258" fill="none" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <path d="M940,192 V128 Q940,120 932,120 H452 Q444,120 444,128 V190" fill="none" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="656" y="96" width="72" height="12" fill="#121612"/><text class="lbl" x="658" y="106">next turn</text>
  <line x1="444" y1="256" x2="444" y2="326" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="452" y="284" width="36" height="12" fill="#121612"/><text class="lbl" x="454" y="294">done</text>

  <!-- nodes -->
  <rect x="32" y="200" width="112" height="48" rx="24" fill="rgba(169,179,156,0.10)" stroke="#7d8873"/>
  <text class="name" x="88" y="230">Request</text>

  <rect x="176" y="192" width="168" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="260" y="220">Warm files</text>
  <text class="sub" x="260" y="242">named + predicted</text>

  <rect x="376" y="192" width="136" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="444" y="220">Model turn</text>
  <text class="sub" x="444" y="242">calls a tool</text>

  <rect x="544" y="192" width="184" height="64" rx="6" fill="#121612"/>
  <rect x="544" y="192" width="184" height="64" rx="6" fill="rgba(168,226,42,0.10)" stroke="url(#wf-focal)" stroke-width="1.6"/>
  <text class="name" x="636" y="220">Outline-first read</text>
  <text class="sub" x="636" y="242">outline + bodies</text>

  <polygon points="796,184 844,224 796,264 748,224" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="dec" x="796" y="220">body</text>
  <text class="dec" x="796" y="236">missing?</text>

  <rect x="872" y="192" width="136" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="940" y="220">Fade</text>
  <text class="sub" x="940" y="242">above 85% only</text>

  <rect x="724" y="320" width="144" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="796" y="348">Range read</text>
  <text class="sub" x="796" y="370">logged as a miss</text>

  <rect x="384" y="328" width="120" height="48" rx="24" fill="rgba(169,179,156,0.10)" stroke="#7d8873"/>
  <text class="name" x="444" y="358">Answer</text>

  <!-- legend -->
  <line x1="32" y1="416" x2="1008" y2="416" stroke="rgba(238,243,228,0.10)" stroke-width="0.8"/>
  <rect x="32" y="436" width="24" height="16" rx="3" fill="rgba(168,226,42,0.10)" stroke="url(#wf-focal)" stroke-width="1.4"/>
  <text class="lbl" x="64" y="448">CortexNET picks what the model sees</text>
  <rect x="352" y="436" width="32" height="16" rx="8" fill="rgba(169,179,156,0.10)" stroke="#7d8873"/>
  <text class="lbl" x="392" y="448">start, end</text>
  <polygon points="520,436 532,444 520,452 508,444" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="lbl" x="540" y="448">decision</text>
  <text class="lbl" x="728" y="448">Every miss trains the include model.</text>
</svg>

</html>
