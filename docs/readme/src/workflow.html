<!doctype html>
<!-- README workflow: one read through CortexNET, from any way in. Rendered to docs/readme/workflow.png by render.py (1040 x 600 CSS px at 2x). -->
<html lang="en" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>One read through CortexNET</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; }
  html, body { width: 1040px; height: 600px; background: transparent; overflow: hidden; }
  svg { display: block; }
  .name { font: 600 16px 'Geist', 'Segoe UI', sans-serif; fill: #eef3e4; text-anchor: middle; }
  .dec { font: 600 12px 'Geist', 'Segoe UI', sans-serif; fill: #eef3e4; text-anchor: middle; }
  .sub { font: 400 12px 'Geist Mono', Consolas, monospace; fill: #a9b39c; text-anchor: middle; }
  .lbl { font: 400 12px 'Geist Mono', Consolas, monospace; fill: #7d8873; }
  .title { font: 600 20px 'Geist', 'Segoe UI', sans-serif; fill: #eef3e4; letter-spacing: -0.01em; }
  .caption { font: 400 14px 'Geist', 'Segoe UI', sans-serif; fill: #a9b39c; }
</style>
</head>
<body>
<svg width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">One read through CortexNET</title>
  <desc id="workflow-desc">Whichever way the read arrives (CortexNET in your own loop locally, or Cortex CLI, the proxy or the MCP server for external sources), CortexNET returns the
    file's outline and the bodies its include model picks. If the agent needs a body it was not shown, it asks for those lines: the range read
    returns them and is logged as a miss that trains the include model for the next read. Otherwise the history is faded once it passes 85% of
    the context, down to 50%, and the next read starts. In Cortex CLI a spiking file manager warms the next files ahead of the read.</desc>
  <defs>
    <radialGradient id="wf-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 0) scale(560 320)">
      <stop offset="0" stop-color="#2fae5c" stop-opacity="0.28"/><stop offset="1" stop-color="#2fae5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wf-edge" x1="0" y1="0" x2="1040" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fae5c" stop-opacity="0.8"/><stop offset="0.5" stop-color="#a8e22a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eef3e4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wf-focal" x1="240" y1="200" x2="424" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fae5c"/><stop offset="0.55" stop-color="#a8e22a"/><stop offset="1" stop-color="#eef35a"/>
    </linearGradient>
    <marker id="wf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b39c"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="599" rx="16" fill="#121612"/>
  <rect x="0.5" y="0.5" width="1039" height="599" rx="16" fill="url(#wf-glow)"/>
  <rect x="0.5" y="0.5" width="1039" height="599" rx="16" fill="none" stroke="url(#wf-edge)"/>

  <text class="title" x="32" y="48">One read through CortexNET</text>
  <text class="caption" x="32" y="76">The same loop locally (CortexNET in your own loop) and for external sources (Cortex CLI, the proxy, the MCP server).</text>

  <!-- connectors -->
  <line x1="332" y1="160" x2="332" y2="198" stroke="#a9b39c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#wf-arrow)"/>
  <text class="lbl" x="342" y="182">warms</text>
  <line x1="208" y1="232" x2="238" y2="232" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="424" y1="232" x2="454" y2="232" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="576" y1="232" x2="594" y2="232" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="716" y1="232" x2="758" y2="232" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="728" y="208" width="20" height="12" fill="#121612"/><text class="lbl" x="730" y="218">no</text>
  <line x1="656" y1="284" x2="656" y2="334" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="664" y="300" width="28" height="12" fill="#121612"/><text class="lbl" x="666" y="310">yes</text>
  <path d="M576,368 H524 Q516,368 516,360 V266" fill="none" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <line x1="656" y1="400" x2="656" y2="446" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <path d="M576,480 H340 Q332,480 332,472 V266" fill="none" stroke="#a8e22a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#wf-arrow)"/>
  <rect x="420" y="456" width="72" height="12" fill="#121612"/><text class="lbl" x="422" y="466">next read</text>
  <path d="M848,264 V520 Q848,528 840,528 H128 Q120,528 120,520 V266" fill="none" stroke="#a9b39c" stroke-width="1.2" marker-end="url(#wf-arrow)"/>
  <rect x="440" y="504" width="72" height="12" fill="#121612"/><text class="lbl" x="442" y="514">next turn</text>

  <!-- nodes -->
  <rect x="240" y="104" width="184" height="56" rx="6" fill="rgba(238,243,228,0.02)" stroke="rgba(238,243,228,0.30)" stroke-dasharray="4,3"/>
  <text class="name" x="332" y="128">Spiking file manager</text>
  <text class="sub" x="332" y="148">Cortex CLI</text>

  <rect x="32" y="200" width="176" height="64" rx="32" fill="rgba(169,179,156,0.10)" stroke="#7d8873"/>
  <text class="name" x="120" y="228">A file read</text>
  <text class="sub" x="120" y="248">from any way in</text>

  <rect x="240" y="200" width="184" height="64" rx="6" fill="#121612"/>
  <rect x="240" y="200" width="184" height="64" rx="6" fill="rgba(168,226,42,0.10)" stroke="url(#wf-focal)" stroke-width="1.6"/>
  <text class="name" x="332" y="228">Outline-first read</text>
  <text class="sub" x="332" y="248">outline + picked bodies</text>

  <rect x="456" y="200" width="120" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="516" y="228">Agent works</text>
  <text class="sub" x="516" y="248">uses the read</text>

  <polygon points="656,180 716,232 656,284 596,232" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="dec" x="656" y="228">needs a body</text>
  <text class="dec" x="656" y="244">not shown?</text>

  <rect x="760" y="200" width="176" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="848" y="228">Watermark fade</text>
  <text class="sub" x="848" y="248">at 85%, down to 50%</text>

  <rect x="576" y="336" width="160" height="64" rx="6" fill="#182018" stroke="rgba(238,243,228,0.55)"/>
  <text class="name" x="656" y="364">Range read</text>
  <text class="sub" x="656" y="386">logged as a miss</text>

  <rect x="576" y="448" width="160" height="64" rx="6" fill="rgba(238,243,228,0.05)" stroke="#a9b39c"/>
  <text class="name" x="656" y="476">Include model</text>
  <text class="sub" x="656" y="498">learns from the miss</text>

  <!-- legend -->
  <line x1="32" y1="552" x2="1008" y2="552" stroke="rgba(238,243,228,0.10)" stroke-width="0.8"/>
  <rect x="32" y="564" width="24" height="16" rx="3" fill="rgba(168,226,42,0.10)" stroke="url(#wf-focal)" stroke-width="1.4"/>
  <text class="lbl" x="64" y="576">CortexNET picks what the model sees</text>
  <line x1="344" y1="572" x2="384" y2="572" stroke="#a8e22a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#wf-arrow)"/>
  <text class="lbl" x="392" y="576">learning loop</text>
  <rect x="520" y="564" width="32" height="16" rx="3" fill="none" stroke="rgba(238,243,228,0.30)" stroke-dasharray="4,3"/>
  <text class="lbl" x="560" y="576">only in Cortex CLI</text>
  <text class="lbl" x="728" y="576">Fade: local CortexNET, Cortex CLI.</text>
</svg>
</body>
</html>
