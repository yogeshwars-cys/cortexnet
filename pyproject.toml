[project]
name = "cortexnet"
version = "0.1.0"
description = "Outline-first file reads and watermark fading for coding agents: the same work from a fraction of the context"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
cortexnet-mcp = "cortexnet.mcp_server:main"
cortexnet-proxy = "cortexnet.proxy:main"
cortex = "cortexnet.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cortexnet"]

[tool.setuptools.package-data]
cortexnet = ["assets/*.ans"]
