[project]
name = "cortexnet"
version = "0.1.0"
description = "A learned coprocessor that decides what code goes into a coding agent's context: outline-first reads, includes learned from the agent's own misses"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
cortexnet-mcp = "cortexnet.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cortexnet"]
